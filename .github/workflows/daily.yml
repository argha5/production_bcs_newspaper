name: Daily edition

on:
  schedule:
    # Primary: 03:15 UTC = 09:15 AM Asia/Dhaka (non-zero minute avoids top-of-the-hour GitHub queue delays)
    - cron: '15 3 * * *'
    # Backup 1: 04:15 UTC = 10:15 AM Asia/Dhaka (runs only if 09:15 was dropped/delayed; exits in 1s if already built)
    - cron: '15 4 * * *'
    # Backup 2: 06:15 UTC = 12:15 PM Asia/Dhaka (failsafe backup)
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Blank = today in Dhaka.'
        required: false
      force:
        description: 'Rebuild even if the edition already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A full edition with 8 articles + API slowdowns can exceed 2 hours.
    # GitHub Actions maximum is 6 hours; 360 gives plenty of headroom.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build today's edition
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
        run: |
          node src/build.js \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Validate data tree
        run: node src/validate.js

      - name: Commit edition
        run: |
          git config user.name  "bcsnewspaper-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          HASH=$(node -e "console.log(require('./data/index.json').latestHash)")
          DATE=$(node -e "console.log(require('./data/index.json').latestDate)")
          git commit -m "edition $DATE ($HASH)"
          git push
