name: Daily edition

on:
  schedule:
    # ─── Primary window: 08:00 AM – 10:00 AM Asia/Dhaka ───────────────────────
    # Run multiple times so at least one hits an available runner.
    # Each backup exits in ~2 s if today's edition already exists.
    - cron: '07 2 * * *'   # 08:07 AM Dhaka
    - cron: '32 2 * * *'   # 08:32 AM Dhaka
    - cron: '03 3 * * *'   # 09:03 AM Dhaka
    - cron: '47 3 * * *'   # 09:47 AM Dhaka

    # ─── Backup window: 10:00 AM – 12:00 PM Asia/Dhaka ────────────────────────
    # Kicks in only if every primary attempt was queued / dropped by GitHub.
    - cron: '13 4 * * *'   # 10:13 AM Dhaka
    - cron: '42 4 * * *'   # 10:42 AM Dhaka
    - cron: '18 5 * * *'   # 11:18 AM Dhaka
    - cron: '52 5 * * *'   # 11:52 AM Dhaka

  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Blank = today in Dhaka.'
        required: false
      force:
        description: 'Rebuild even if the edition already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A full edition with 8 articles + API slowdowns can exceed 2 hours.
    # GitHub Actions maximum is 6 hours; 360 gives plenty of headroom.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fast-exit check: skip in ~2 seconds if today's edition is already built.
      # This prevents duplicate API usage and push conflicts on backup runs.
      - name: Check if already built today
        run: |
          git pull --rebase origin main || true
          DHAKA_DATE="${{ inputs.date }}"
          if [ -z "$DHAKA_DATE" ]; then
            DHAKA_DATE=$(node -e "const d = new Date(Date.now() + 6 * 3600 * 1000); console.log(d.toISOString().slice(0, 10))")
          fi
          echo "Target edition date: $DHAKA_DATE"
          if [ -f "data/${DHAKA_DATE}.json" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Edition for ${DHAKA_DATE} already exists. Skipping duplicate build."
            exit 0
          fi

      - name: Build today's edition
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
        run: |
          node src/build.js \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Validate data tree
        run: node src/validate.js

      - name: Commit and push edition
        run: |
          git config user.name  "bcsnewspaper-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          HASH=$(node -e "console.log(require('./data/index.json').latestHash)")
          DATE=$(node -e "console.log(require('./data/index.json').latestDate)")
          git commit -m "edition $DATE ($HASH)"

          # Rebase-then-push with 5 retries to handle concurrent run race conditions.
          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git pull --rebase origin main && git push origin main && break || sleep 8
          done
