name: Daily edition

on:
  schedule:
    # Early morning primary: 01:23 UTC = 07:23 AM Asia/Dhaka (off-peak runner queue, quick start)
    - cron: '23 1 * * *'
    # Morning backup 1: 03:17 UTC = 09:17 AM Asia/Dhaka (covers any runner queue drops)
    - cron: '17 3 * * *'
    # Mid-morning backup 2: 05:12 UTC = 11:12 AM Asia/Dhaka (failsafe backup)
    - cron: '12 5 * * *'
    # Final backup: 06:48 UTC = 12:48 PM Asia/Dhaka (guarantees completion by 1:00 PM)
    - cron: '48 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Blank = today in Dhaka.'
        required: false
      force:
        description: 'Rebuild even if the edition already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A full edition with 8 articles + API slowdowns can exceed 2 hours.
    # GitHub Actions maximum is 6 hours; 360 gives plenty of headroom.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fast check: If edition is already built today, exit cleanly in seconds
      # without exhausting daily AI token quotas or triggering push conflicts.
      - name: Check if already built today
        run: |
          git pull --rebase origin main || true
          DHAKA_DATE="${{ inputs.date }}"
          if [ -z "$DHAKA_DATE" ]; then
            DHAKA_DATE=$(node -e "const d = new Date(Date.now() + 6 * 3600 * 1000); console.log(d.toISOString().slice(0, 10))")
          fi
          echo "Target edition date: $DHAKA_DATE"
          if [ -f "data/${DHAKA_DATE}.json" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Edition for ${DHAKA_DATE} already exists. Skipping duplicate build."
            exit 0
          fi

      - name: Build today's edition
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
        run: |
          node src/build.js \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Validate data tree
        run: node src/validate.js

      - name: Commit and push edition
        run: |
          git config user.name  "bcsnewspaper-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          HASH=$(node -e "console.log(require('./data/index.json').latestHash)")
          DATE=$(node -e "console.log(require('./data/index.json').latestDate)")
          git commit -m "edition $DATE ($HASH)"
          
          # Rebase and push with retry to prevent race condition push rejections
          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git pull --rebase origin main && git push origin main && break || sleep 6
          done
